<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buenos días, Especial ✨</title>
    <style>
        /* FONTS & RESET */
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fffaf0; /* Fondo crema suave */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Evita scroll en la intro */
            background-image: 
                radial-gradient(#ffe5ec 1px, transparent 1px),
                radial-gradient(#ffe5ec 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* PAISAJE DE FONDO (Acuarela Dibujada) */
        .landscape-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><path d="M0 600 C 200 500, 400 700, 600 600 C 800 500, 1000 700, 1000 600 L 1000 1000 L 0 1000 Z" fill="%23ff758f"/><path d="M0 700 C 250 600, 500 800, 750 700 C 1000 600, 1250 800, 1250 700 L 1250 1000 L 0 1000 Z" fill="%23fdbfcf"/></svg>');
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* TARJETA PRINCIPAL (Diseño Estético) */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            max-width: 390px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 35px;
            box-shadow: 0 15px 45px rgba(255, 77, 109, 0.12);
            text-align: center;
            border: 2px solid rgba(255, 182, 193, 0.5); /* Borde rosa suave */
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        /* Decoraciones de Esquina */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 80px; height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.6;
        }
        .card::before {
            top: -15px; left: -15px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffb6c1"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
        }
        .card::after {
            bottom: -15px; right: -15px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffb6c1"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>');
        }

        /* Elementos Visibles */
        .emoji-header {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            color: #ff4d6d;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-family: 'Caveat', cursive;
            color: #7f8c8d;
            font-size: 20px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Sección de Pregunta y Botones (Intro) */
        .question-box {
            background: #ffe5ec;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            color: #590d22;
            font-weight: 500;
            font-size: 16px;
            border: 1px dashed #ffb6c1;
        }

        .playground {
            position: relative;
            height: 130px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, box-shadow 0.3s;
        }

        .btn-yes {
            background: #ff4d6d;
            color: white;
            padding: 16px 30px;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.3);
            z-index: 2;
        }
        .btn-yes:hover { background: #ff758f; }

        .btn-no {
            background: #f1f3f5;
            color: #7f8c8d;
            padding: 16px 25px;
            z-index: 3;
            transition: left 0.3s ease, top 0.3s ease;
        }

        .hint-text {
            font-size: 14px;
            color: #ff758f;
            min-height: 24px;
            margin-top: 10px;
            font-weight: 500;
            font-style: italic;
        }

        /* SECCIÓN DE CUMPLIDOS (Oculta al inicio) */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s ease forwards; }

        /* Contenedor de la Imagen (CORREGIDO) */
        .photo-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 25px auto;
            border-radius: 50%; /* Foto Circular */
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        /* Overlay de dibujo sobre la foto */
        .photo-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.2"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)"/></svg>');
            pointer-events: none;
        }

        .counter {
            font-size: 13px;
            color: #ff8fa3;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .message-box {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            color: #590d22;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            border: 1px solid #ffe5ec;
            position: relative;
        }
        .message-box::before {
            content: '“';
            position: absolute;
            top: 5px; left: 15px;
            font-size: 50px;
            color: #ffb6c1;
            font-family: 'Caveat', cursive;
        }

        .btn-next {
            width: 100%;
            background: #ff4d6d;
            color: white;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.3);
        }
        .btn-next:hover { background: #ff758f; }

        /* Lluvia de partículas (Corazones/Estrellas) */
        .particle {
            position: fixed;
            top: -30px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 100;
            animation: fall linear forwards;
        }

        /* ANIMACIONES */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* RESPONSIVE (Ajustes para celular) */
        @media (max-width: 400px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 22px; }
            p.subtitle { font-size: 18px; }
            .emoji-header { font-size: 40px; }
            .photo-container { width: 140px; height: 140px; }
            .playground { height: 110px; }
        }
    </style>
</head>
<body>

    <div class="landscape-bg"></div>

    <div class="card fade-in">
        <!-- PANTALLA 1: INTRO JUGUETONA -->
        <div id="screen-intro">
            <div class="emoji-header">☀️</div>
            <h1>Hola tú ✨</h1>
            <p class="subtitle">Desperté pensando en nuestra salida de ayer y quise hacerte este detalle...</p>
            
            <div class="question-box">
                ¿Te gustaría leer unas cosas que pienso de ti?
            </div>

            <div class="playground" id="playground">
                <button class="btn-yes" id="btn-yes" onclick="iniciarCumplidos()">¡Sí, claro! 👀</button>
                <button class="btn-no" id="btn-no">Nop</button>
            </div>

            <div class="hint-text" id="hint-text"></div>
        </div>

        <!-- PANTALLA 2: CUMPLIDOS Y FOTO -->
        <div id="screen-compliments" class="hidden">
            <div class="counter" id="contador">1 / 8</div>
            
            <div class="photo-container">
                <!-- Asegúrate de renombrar tu imagen en GitHub a nosotros.jpg -->
                <img src="nosotros.jpg" alt="Nosotros">
            </div>

            <h1>Lo que me gusta de ti</h1>
            <p class="subtitle">Cada vez que presiones el botón, saldrá algo nuevo:</p>
            
            <div class="message-box" id="display">
                Tienes una sonrisa que alegra el día entero.
            </div>

            <button class="btn-next" id="btn-next" onclick="siguienteCumplido()">Siguiente ❤️</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const playground = document.getElementById('playground');
        const hintText = document.getElementById('hint-text');

        const frasesEscape = [
            "¿Segura? 🤔",
            "¡Intenta otra vez!",
            "Ese botón no funciona 😉",
            "Casi...",
            "Mejor dale al otro botón ❤️",
            "¡No te arrepentirás!"
        ];

        let escapeCount = 0;
        let yesScale = 1;

        // Función del botón "No" que huye
        function moverBotonNo(e) {
            if (e) e.preventDefault(); // Evita clics accidentales en celular

            // Hace el botón absoluto para moverlo
            btnNo.style.position = 'absolute';

            // Calcula límites para que no se salga de la tarjeta
            const cardWidth = document.querySelector('.card').clientWidth;
            const cardHeight = document.querySelector('.card').clientHeight;
            const padding = 30; // Margen interno de seguridad

            const maxX = cardWidth - btnNo.offsetWidth - padding * 2;
            const maxY = cardHeight - btnNo.offsetHeight - padding * 2;

            const randomX = Math.floor(Math.random() * maxX) + padding;
            const randomY = Math.floor(Math.random() * maxY) + padding;

            // Aplica la nueva posición
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            // Cambia el texto de ayuda
            hintText.innerText = frasesEscape[escapeCount % frasesEscape.length];
            escapeCount++;

            // Hace crecer el botón de "Sí" para invitarla a darle clic
            if (yesScale < 1.4) {
                yesScale += 0.08;
                btnYes.style.transform = `scale(${yesScale})`;
                btnYes.style.boxShadow = `0 ${8 * yesScale}px ${25 * yesScale}px rgba(255, 77, 109, 0.4)`;
            }
        }

        // Eventos para computadora y celular
        btnNo.addEventListener('mouseover', moverBotonNo);
        btnNo.addEventListener('touchstart', moverBotonNo, { passive: false });
        btnNo.addEventListener('click', moverBotonNo); // Para clics finales


        // Lógica de Cumplidos (Pantalla 2)
        // He cambiado las frases para que sean más sinceras y la última más potente.
        const cumplidos = [
            "Tienes una sonrisa que alegra el día entero.",
            "Me encanta lo fácil y natural que se siente platicar contigo.",
            "Tienes una forma de ser súper linda, de esas que hacen querer conocerte más.",
            "No sé cómo le haces, pero siempre te ves increíble.",
            "Me gusta mucho tu forma de pensar y la forma en que ves el mundo.",
            "Haces que el tiempo se pase volando cuando estamos juntos.",
            "Ayer la pasé de maravilla, y gran parte fue por tu compañía.",
            "En resumen: me gustas mucho y espero que este detalle te haya sacado una sonrisa. ¡Que tengas un gran día! ❤️"
        ];

        let indice = 1; // Empieza en 1 porque el 0 ya está en pantalla

        function iniciarCumplidos() {
            const intro = document.getElementById('screen-intro');
            const comp = document.getElementById('screen-compliments');

            intro.classList.add('hidden');
            comp.classList.remove('hidden');
            comp.classList.add('fade-in');
            
            // Lanza una lluvia inicial de corazones
            lanzarLluvia(10); 
        }

        function siguienteCumplido() {
            const display = document.getElementById('display');
            const contador = document.getElementById('contador');
            const btnNext = document.getElementById('btn-next');

            // Efecto de desvanecimiento
            display.style.opacity = 0;
            display.style.transform = 'translateY(10px)';

            setTimeout(() => {
                display.innerText = cumplidos[indice];
                contador.innerText = `${indice + 1} / ${cumplidos.length}`;

                // Si es el último, cambia el botón y lanza lluvia
                if (indice === cumplidos.length - 1) {
                    btnNext.innerText = "Volver a leer ❤️";
                    lanzarLluvia(25); // Lluvia fuerte al final
                } else {
                    btnNext.innerText = "Siguiente ✨";
                }

                // Incrementa índice
                indice = (indice + 1) % cumplidos.length;
                
                // Efecto de aparición
                display.style.opacity = 1;
                display.style.transform = 'translateY(0)';
            }, 300);
        }

        function lanzarLluvia(cantidad) {
            const simbolos = ["✨", "❤️", "🌸", "☀️", "💖"];
            for (let i = 0; i < cantidad; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.classList.add('particle');
                    p.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.animationDuration = (Math.random() * 2 + 3) + 's'; // Duración variable
                    p.style.fontSize = (Math.random() * 10 + 20) + 'px'; // Tamaño variable
                    document.body.appendChild(p);

                    // Borra la partícula después de la animación
                    setTimeout(() => p.remove(), 5000);
                }, i * 150); // Delay entre cada partícula
            }
        }
    </script>
</body>
</html>
