<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buenos días ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #f8edeb 50%, #f3d5b5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.14);
            text-align: center;
            border: 1px solid rgba(255, 229, 236, 0.8);
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .emoji-header {
            font-size: 44px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            color: #ff4d6d;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        p.subtitle {
            color: #5c677d;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Estilo de la foto */
        .photo-frame {
            width: 155px;
            height: 155px;
            margin: 0 auto 18px auto;
            border-radius: 22px;
            overflow: hidden;
            border: 4px solid #ffe5ec;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.18);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        /* Sección 1: Pregunta inicial */
        .question-box {
            background: #fff0f3;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 22px;
            color: #590d22;
            font-weight: 600;
            font-size: 16px;
        }

        .playground {
            position: relative;
            height: 115px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        button {
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.2s;
        }

        .btn-yes {
            background: #ff4d6d;
            color: white;
            padding: 14px 26px;
            box-shadow: 0 6px 18px rgba(255, 77, 109, 0.3);
            z-index: 2;
        }

        .btn-yes:hover {
            background: #ff758f;
        }

        .btn-no {
            background: #f1f3f5;
            color: #6c757d;
            padding: 14px 22px;
            z-index: 3;
            transition: left 0.25s ease, top 0.25s ease, background 0.2s;
        }

        .hint-text {
            font-size: 13px;
            color: #ff758f;
            min-height: 20px;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Sección 2: Cumplidos */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .counter {
            font-size: 12px;
            color: #ff8fa3;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .message-box {
            background: #fff0f3;
            border-radius: 18px;
            padding: 22px 18px;
            min-height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #590d22;
            font-size: 15.5px;
            font-weight: 500;
            line-height: 1.5;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .btn-next {
            width: 100%;
            background: #ff4d6d;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 6px 18px rgba(255, 77, 109, 0.28);
        }

        .btn-next:hover {
            background: #ff758f;
            transform: translateY(-2px);
        }

        .btn-next:active {
            transform: scale(0.97);
        }

        /* Lluvia de partículas */
        .particle {
            position: fixed;
            top: -30px;
            font-size: 22px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- PANTALLA 1: BUENOS DÍAS Y BOTÓN QUE SE ESCAPA -->
        <div id="screen-intro">
            <div class="emoji-header">☀️</div>
            <h1>Buenos días ✨</h1>
            <p class="subtitle">Hice esta página rápida esta mañana porque me quedé pensando en nuestra salida de ayer.</p>
            
            <div class="question-box">
                ¿Quieres ver qué opino de ti?
            </div>

            <div class="playground" id="playground">
                <button class="btn-yes" id="btn-yes" onclick="iniciarCumplidos()">Sí, a ver 👀</button>
                <button class="btn-no" id="btn-no">No</button>
            </div>

            <div class="hint-text" id="hint-text"></div>
        </div>

        <!-- PANTALLA 2: FOTO + CUMPLIDOS -->
        <div id="screen-compliments" class="hidden">
            <div class="counter" id="contador">1 / 8</div>
            
            <div class="photo-frame">
                <img src="nosotros.jpg" alt="Nosotros">
            </div>

            <h1>Lo que me gusta de ti</h1>
            <p class="subtitle">Presiona el botón para ir leyendo uno por uno:</p>
            
            <div class="message-box" id="display">
                Tienes una sonrisa que alegra el día entero.
            </div>

            <button class="btn-next" id="btn-next" onclick="siguienteCumplido()">Siguiente ✨</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const playground = document.getElementById('playground');
        const hintText = document.getElementById('hint-text');

        const frasesEscape = [
            "Ese botón no funciona hoy 😌",
            "Intenta con el otro...",
            "¡Ups! Casi lo atrapas",
            "No te hagas del rogar ✨",
            "Creo que te equivocaste de botón",
            "Sigue intentando... o dale que sí 😉"
        ];

        let escapeCount = 0;
        let yesScale = 1;

        function moverBotonNo(e) {
            if (e) e.preventDefault();

            btnNo.style.position = 'absolute';

            const maxX = playground.clientWidth - btnNo.offsetWidth;
            const maxY = playground.clientHeight - btnNo.offsetHeight;

            const randomX = Math.max(0, Math.floor(Math.random() * maxX));
            const randomY = Math.max(0, Math.floor(Math.random() * maxY));

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            hintText.innerText = frasesEscape[escapeCount % frasesEscape.length];
            escapeCount++;

            if (yesScale < 1.35) {
                yesScale += 0.06;
                btnYes.style.transform = `scale(${yesScale})`;
            }
        }

        btnNo.addEventListener('mouseover', moverBotonNo);
        btnNo.addEventListener('touchstart', moverBotonNo, { passive: false });
        btnNo.addEventListener('click', moverBotonNo);

        const cumplidos = [
            "Tienes una sonrisa que alegra el día entero.",
            "Me encanta lo fácil y natural que se siente platicar contigo.",
            "Tienes una forma de ser súper linda que hace que quiera seguir conociéndote más.",
            "No sé cómo le haces, pero siempre te ves increíble.",
            "Me gusta mucho cómo piensas y la forma en que ves las cosas.",
            "Haces que el tiempo se pase volando cuando estamos juntos.",
            "Tienes una mirada muy bonita.",
            "En resumen: me gustas mucho y me encantó haber salido contigo ayer. ¡Que tengas un gran día! ☀️"
        ];

        let indice = 1;

        function iniciarCumplidos() {
            const intro = document.getElementById('screen-intro');
            const comp = document.getElementById('screen-compliments');

            intro.classList.add('hidden');
            comp.classList.remove('hidden');
            comp.classList.add('fade-in');
        }

        function siguienteCumplido() {
            const display = document.getElementById('display');
            const contador = document.getElementById('contador');
            const btnNext = document.getElementById('btn-next');

            display.style.opacity = 0;
            display.style.transform = 'translateY(4px)';

            setTimeout(() => {
                display.innerText = cumplidos[indice];
                contador.innerText = `${indice + 1} / ${cumplidos.length}`;

                if (indice === cumplidos.length - 1) {
                    btnNext.innerText = "Volver a leer ↺";
                    lanzarLluvia();
                } else {
                    btnNext.innerText = "Siguiente ✨";
                }

                indice = (indice + 1) % cumplidos.length;
                display.style.opacity = 1;
                display.style.transform = 'translateY(0)';
            }, 200);
        }

        function lanzarLluvia() {
            const simbolos = ["✨", "❤️", "☀️", "🌸"];
            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.classList.add('particle');
                    p.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                    document.body.appendChild(p);

                    setTimeout(() => p.remove(), 4500);
                }, i * 90);
            }
        }
    </script>

</body>
</html>
